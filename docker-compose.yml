services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailux-backend
    network_mode: host
    pid: host
    privileged: true
    restart: unless-stopped
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
      - /etc/group:/etc/group:ro
      - /etc/gshadow:/etc/gshadow:ro
      - /etc/nsswitch.conf:/etc/nsswitch.conf:ro
      - ./backend/pam/mailux:/etc/pam.d/mailux:ro
      - /home:/home:ro
      - /var/mail:/var/mail
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailux-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped