services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailux-backend
    network_mode: host
    pid: host
    privileged: true
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
      - /etc/group:/etc/group:ro
      - /etc/pam.d:/etc/pam.d:ro
      - /lib/x86_64-linux-gnu/security:/lib/x86_64-linux-gnu/security:ro
      - /home:/home
      - /var/mail:/var/mail
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailux-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped